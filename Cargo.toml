[package]
authors = ["Nobel von IT"]
categories = ["command-line-utilities", "config"]
description = "DEPendency Initialization manager"
edition = "2024"
keywords = ["dependencies", "manager", "projects"]
license = "MIT"
name = "depi"
repository = "https://github.com/nobel-von-it/depi.git"
version = "0.1.0"

[dependencies]
anyhow = "1.0.99"
colored = "3.0.0"
env_logger = "0.11.8"
futures = "0.3.31"
libc = "0.2.177"
log = "0.4.28"
once_cell = "1.21.3"
rand = "0.9.2"
reqwest = "0.12.23"
serde_json = "1.0.143"
toml = "0.9.5"
toml_edit = "0.23.9"

[dependencies.clap]
version = "4.5.45"
features = ["derive"]

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.tokio]
version = "1.47.1"
features = ["macros", "rt", "rt-multi-thread"]
